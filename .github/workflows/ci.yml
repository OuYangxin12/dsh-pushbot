name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PUSHBOT_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: syntax + unit tests
        run: bash ops/ci.sh

  freeze:
    runs-on: ubuntu-latest
    env:
      PUSHBOT_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: bootstrap checksums unchanged
        run: node ops/freeze.mjs --verify
